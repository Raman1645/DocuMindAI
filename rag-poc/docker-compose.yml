version: '3.8'

services:
  documind-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: documind_ai_app
    ports:
      - "7860:7860"
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=7860
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
    restart: unless-stopped
